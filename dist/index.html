<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Deskly</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", sans-serif; background: #121212; color: #eee; }
  body { display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  header { padding: 16px 20px; border-bottom: 1px solid #262626; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 12px; color: #888; }
  #backBtn { background: #1f1f1f; color: #eee; padding: 6px 10px; font-size: 16px; line-height: 1; }

  .scroll { flex: 1; overflow-y: auto; }
  .list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .widget-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #1b1b1b; border: 1px solid #262626; border-radius: 10px; padding: 14px 16px; }
  .widget-row .name { font-size: 14px; font-weight: 600; }
  .widget-row .desc { font-size: 12px; color: #888; margin-top: 2px; }
  .pin { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: #aaa; cursor: pointer; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }

  button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-add { background: #00ff9c; color: #0a0a0a; }
  .btn-remove { background: #2a2a2a; color: #eee; }
  .btn-ghost { background: #1f1f1f; color: #eee; border: 1px solid #333; }
  .btn-ghost:hover, #backBtn:hover { background: #292929; }

  .panel { padding: 8px 20px 28px; }
  .hint { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: #1b1b1b; border: 1px solid #2a2a2a; font-size: 12px; color: #aaa; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hint button { padding: 6px 10px; font-size: 12px; }

  section { margin-top: 22px; }
  section h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #777; margin: 0 0 10px; font-weight: 600; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; min-height: 40px; }
  .field > label, .field > .lbl { font-size: 13px; color: #ddd; }
  .field .sub { font-size: 11px; color: #777; display: block; margin-top: 2px; }

  .seg { display: inline-flex; background: #1b1b1b; border: 1px solid #2c2c2c; border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { background: transparent; color: #aaa; padding: 6px 11px; font-size: 12px; border-radius: 7px; }
  .seg button.on { background: #00ff9c; color: #0a0a0a; }

  select, input[type=text] { background: #1b1b1b; color: #eee; border: 1px solid #2c2c2c; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; min-width: 150px; }
  input[type=text]::placeholder { color: #666; }
  input[type=color] { width: 38px; height: 30px; padding: 0; border: 1px solid #2c2c2c; border-radius: 8px; background: #1b1b1b; cursor: pointer; }
  input[type=checkbox] { flex-shrink: 0; width: 38px; height: 22px; appearance: none; background: #333; border-radius: 999px; position: relative; cursor: pointer; transition: background .15s; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #ddd; transition: transform .15s; }
  input[type=checkbox]:checked { background: #00ff9c; }
  input[type=checkbox]:checked::after { transform: translateX(16px); background: #0a0a0a; }
  input[type=checkbox].sm { width: 30px; height: 18px; }
  input[type=checkbox].sm::after { top: 3px; left: 3px; width: 12px; height: 12px; }
  input[type=checkbox].sm:checked::after { transform: translateX(12px); }
  .range { display: flex; align-items: center; gap: 10px; }
  input[type=range] { width: 150px; accent-color: #00ff9c; }
  .range .val { width: 58px; text-align: right; font-size: 12px; color: #999; font-variant-numeric: tabular-nums; }
  .colors { display: flex; align-items: center; gap: 8px; }
  .colors span { font-size: 11px; color: #777; }

  .city-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; background: #1b1b1b; border: 1px solid #262626; border-radius: 9px; margin-bottom: 6px; font-size: 13px; }
  .city-item small { color: #777; margin-left: 6px; font-size: 11px; }
  .city-item .btns { display: flex; gap: 4px; }
  .city-item .btns button { background: #262626; color: #ccc; padding: 3px 8px; font-size: 12px; }
  .city-item .btns button:disabled { opacity: .3; cursor: default; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row input { flex: 1; min-width: 0; }
  .msg { font-size: 12px; color: #ff9a8a; margin-top: 6px; min-height: 16px; }
  .msg.info { color: #777; }
  .reset { margin-top: 26px; }
</style>
</head>
<body>

<!-- ============ widget list ============ -->
<div id="viewList" class="view">
  <header>
    <div>
      <h1>Deskly</h1>
      <p>Add or remove desktop widgets. Closing this window keeps your widgets running — use the tray icon to bring it back.</p>
    </div>
  </header>
  <div class="scroll"><div class="list" id="widgetList"></div></div>
</div>

<!-- ============ widget settings ============ -->
<div id="viewSettings" class="view" hidden>
  <header>
    <button id="backBtn" title="Back">‹</button>
    <div>
      <h1 id="settingsTitle"></h1>
      <p>Changes apply to the widget live.</p>
    </div>
  </header>
  <div class="scroll">
    <div class="panel">
      <div class="hint" id="inactiveHint" hidden>
        <span>This widget isn't on your desktop yet.</span>
        <button id="hintAdd" class="btn-add">Add it</button>
      </div>
      <div id="settingsBody"></div>
      <button class="btn-ghost reset" id="resetBtn">Reset to defaults</button>
    </div>
  </div>
</div>

<script src="shared/common.js"></script>
<script src="shared/clock-shared.js"></script>
<script src="shared/pomodoro-shared.js"></script>
<script src="shared/system-shared.js"></script>
<script src="shared/weather-shared.js"></script>
<script src="shared/calendar-shared.js"></script>
<script src="shared/widget-registry.js"></script>
<script>
  const CS = window.ClockShared;          // used by the cities editor
  const WX = window.WeatherShared;        // used by the place search
  const REGISTRY = window.WidgetRegistry;
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  let states = {};          // id -> { active, pinned }
  let current = null;       // { def, S, fields: Map(key -> field), shows: [{el, field}], dims: [{el, section}] }
  let lastLocalPatch = 0;
  const zones = CS.allTimeZones();

  // ============================================================
  // navigation
  // ============================================================
  function showView(name) {
    $("#viewList").hidden = name !== "list";
    $("#viewSettings").hidden = name !== "settings";
  }
  $("#backBtn").addEventListener("click", () => { current = null; showView("list"); });

  // ============================================================
  // widget list
  // ============================================================
  async function refreshStates() {
    try { states = await invoke("get_widget_states"); } catch (err) { console.error("Deskly: failed to load widget states:", err); }
    renderList();
    renderHint();
  }

  function renderList() {
    const list = $("#widgetList");
    list.innerHTML = REGISTRY.map(def => {
      const st = states[def.id] || { active: false, pinned: false };
      return `<div class="widget-row" data-id="${def.id}">
        <div>
          <div class="name">${esc(def.name)}</div>
          <div class="desc">${esc(def.description)}</div>
          <label class="pin" title="Keeps this widget behind your other windows">
            <input type="checkbox" class="sm" data-pin ${st.pinned ? "checked" : ""} /> Pin to desktop
          </label>
        </div>
        <div class="actions">
          <button class="btn-ghost" data-customize>Customize</button>
          <button data-toggle class="${st.active ? "btn-remove" : "btn-add"}">${st.active ? "Remove" : "Add"}</button>
        </div>
      </div>`;
    }).join("");
  }

  async function setActive(id, active) {
    try { await invoke("set_widget_active", { id, active }); } catch (err) { console.error("Deskly: failed to toggle widget:", err); }
    await refreshStates();
  }

  $("#widgetList").addEventListener("click", async (e) => {
    const row = e.target.closest(".widget-row");
    if (!row) return;
    const id = row.dataset.id;
    if (e.target.closest("[data-toggle]")) setActive(id, !(states[id] && states[id].active));
    else if (e.target.closest("[data-customize]")) openSettings(id);
  });

  $("#widgetList").addEventListener("change", async (e) => {
    const box = e.target.closest("[data-pin]");
    if (!box) return;
    const id = box.closest(".widget-row").dataset.id;
    try { await invoke("set_widget_pinned", { id, pinned: box.checked }); } catch (err) { console.error("Deskly: failed to pin widget:", err); }
    await refreshStates();
  });

  function renderHint() {
    $("#inactiveHint").hidden = !current || !!(states[current.def.id] && states[current.def.id].active);
  }
  $("#hintAdd").addEventListener("click", () => current && setActive(current.def.id, true));

  // ============================================================
  // settings panel, built from the widget's schema
  // ============================================================
  async function openSettings(id) {
    const def = REGISTRY.find(d => d.id === id);
    if (!def) return;
    let saved = {};
    try { saved = await invoke("get_widget_settings", { id }); } catch (err) { console.error("Deskly: failed to load settings:", err); }
    current = { def, S: def.merge(saved), fields: new Map(), shows: [], dims: [] };
    $("#settingsTitle").textContent = def.name;
    buildPanel();
    refreshUI();
    renderHint();
    showView("settings");
  }

  function elFrom(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function labelHtml(f) {
    return `<span class="lbl">${esc(f.label)}${f.sub ? `<span class="sub">${esc(f.sub)}</span>` : ""}</span>`;
  }

  function fieldEl(f) {
    switch (f.type) {
      case "seg":
        return elFrom(`<div class="field">${labelHtml(f)}<div class="seg" data-key="${f.key}">${
          f.options.map((o, i) => `<button data-i="${i}">${esc(o.label)}</button>`).join("")}</div></div>`);
      case "toggle":
        return elFrom(`<div class="field">${labelHtml(f)}<input type="checkbox" data-key="${f.key}" /></div>`);
      case "select":
        return elFrom(`<div class="field">${labelHtml(f)}<select data-key="${f.key}">${
          f.options.map((o, i) => `<option value="${i}">${esc(o.label)}</option>`).join("")}</select></div>`);
      case "range":
        return elFrom(`<div class="field">${labelHtml(f)}<div class="range"><input type="range" data-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" /><span class="val" data-val="${f.key}"></span></div></div>`);
      case "text":
        return elFrom(`<div class="field">${labelHtml(f)}<input type="text" data-key="${f.key}" placeholder="${esc(f.placeholder || "")}" /></div>`);
      case "color":
        return elFrom(`<div class="field">${labelHtml(f)}<div class="colors"><input type="color" data-key="${f.key}" />${
          f.allowAuto ? `<div class="seg"><button data-auto="${f.key}">Auto</button></div>` : ""}</div></div>`);
      case "colorpair":
        return elFrom(`<div class="field">${labelHtml(f)}<div class="colors">${
          f.keys.map((k, i) => `<span>${esc(f.names[i])}</span><input type="color" data-key="${k}" />`).join("")}</div></div>`);
      case "place":
        return elFrom(`<div>
          <div class="field"><span class="lbl">Current location<span class="sub" data-place-current>Not set</span></span>
            <button class="btn-ghost" data-place-clear>Clear</button></div>
          <div class="add-row">
            <input type="text" data-place-input placeholder="Search a city, e.g. Tokyo" />
            <button class="btn-ghost" data-place-search>Search</button>
          </div>
          <div data-place-results style="margin-top:8px"></div>
          <div class="msg info" data-place-msg>Weather data by Open-Meteo.com. Deskly sends it only the coordinates of the place you pick. No account or API key.</div></div>`);
      case "events-admin":
        return elFrom(`<div>
          <div class="field"><span class="lbl">Saved events<span class="sub" data-ev-count>0 events</span></span>
            <button class="btn-ghost" data-ev-clear>Delete all events…</button></div>
          <div class="msg info">Add and edit events on the widget itself. "Reset to defaults" never deletes your events.</div></div>`);
      case "cities":
        return elFrom(`<div>
          <div class="field"><span class="lbl">Your location label<span class="sub">Blank uses your time zone's city</span></span>
            <input type="text" data-key="${f.labelKey}" placeholder="e.g. Thane" /></div>
          <div data-cities-list></div>
          <div class="add-row">
            <input type="text" data-cities-input list="tzlist" placeholder="Add a city, e.g. Tokyo or Europe/Paris" />
            <datalist id="tzlist">${zones.map(z => `<option value="${esc(z)}"></option>`).join("")}</datalist>
            <button class="btn-ghost" data-cities-add>Add</button>
          </div>
          <div class="msg" data-cities-msg></div></div>`);
    }
    return elFrom("<div></div>");
  }

  function buildPanel() {
    const body = $("#settingsBody");
    body.innerHTML = "";
    for (const sec of current.def.schema) {
      const s = elFrom(`<section><h2>${esc(sec.title)}</h2></section>`);
      for (const f of sec.fields) {
        const el = fieldEl(f);
        if (f.key) current.fields.set(f.key, f);
        (f.keys || []).forEach(k => current.fields.set(k, f));
        if (f.labelKey) current.fields.set(f.labelKey, { type: "text" });
        if (f.showIf) current.shows.push({ el, field: f });
        if (f.type === "cities") wireCities(el, f);
        if (f.type === "place") wirePlace(el, f);
        if (f.type === "events-admin") wireEventsAdmin(el);
        s.appendChild(el);
      }
      if (sec.dimIf) current.dims.push({ el: s, section: sec });
      body.appendChild(s);
    }
  }

  // ---- send changes (coalesced to one call per animation frame) ----
  let pending = {}, flushQueued = false;
  function patch(obj) {
    Object.assign(current.S, obj);
    Object.assign(pending, obj);
    lastLocalPatch = performance.now();
    if (!flushQueued) {
      flushQueued = true;
      const id = current.def.id;
      requestAnimationFrame(() => {
        flushQueued = false;
        const p = pending; pending = {};
        invoke("patch_widget_settings", { id, patch: p }).catch(console.error);
      });
    }
    refreshDerived();
  }

  $("#settingsBody").addEventListener("click", (e) => {
    if (!current) return;
    const auto = e.target.closest("[data-auto]");
    if (auto) { patch({ [auto.dataset.auto]: "auto" }); refreshUI(); return; }
    const b = e.target.closest(".seg[data-key] button");
    if (!b) return;
    const key = b.parentElement.dataset.key;
    const f = current.fields.get(key);
    patch({ [key]: f.options[Number(b.dataset.i)].v });
    refreshUI();
  });

  function onControl(e) {
    if (!current) return;
    const el = e.target;
    const key = el.dataset && el.dataset.key;
    if (!key || el.closest(".seg")) return;
    const f = current.fields.get(key);
    if (!f) return;
    if (el.type === "checkbox") patch({ [key]: el.checked });
    else if (el.type === "range") patch({ [key]: Number(el.value) });
    else if (el.tagName === "SELECT") patch({ [key]: f.options[Number(el.value)].v });
    else patch({ [key]: el.value });
    if (f.type === "select") refreshDerived();
  }
  $("#settingsBody").addEventListener("input", onControl);
  $("#settingsBody").addEventListener("change", onControl);

  // ---- reflect state in the controls ----
  function accentHex(S) {
    const t = C_resolve(S);
    return "#" + t.accent.split(" ").map(n => Number(n).toString(16).padStart(2, "0")).join("");
  }
  const C_resolve = (S) => window.WidgetCommon.resolveTheme(S, false);

  function refreshDerived() {
    const S = current.S;
    for (const { el, field } of current.shows) el.hidden = !field.showIf(S);
    for (const { el, section } of current.dims) el.style.opacity = section.dimIf(S) ? 0.55 : 1;
    for (const v of document.querySelectorAll("[data-val]")) {
      const f = current.fields.get(v.dataset.val);
      v.textContent = S[v.dataset.val] + (f.unit || "");
    }
    for (const b of document.querySelectorAll("[data-auto]")) b.className = S[b.dataset.auto] === "auto" ? "on" : "";
  }

  function refreshUI() {
    const S = current.S;
    for (const el of document.querySelectorAll("#settingsBody [data-key]")) {
      const key = el.dataset.key, f = current.fields.get(key);
      if (!f) continue;
      if (el.classList.contains("seg")) {
        f.options.forEach((o, i) => el.children[i].classList.toggle("on", String(o.v) === String(S[key])));
      } else if (el.type === "checkbox") el.checked = !!S[key];
      else if (el.type === "color") el.value = S[key] === "auto" ? accentHex(S) : S[key];
      else if (el.tagName === "SELECT") el.value = String(Math.max(0, f.options.findIndex(o => String(o.v) === String(S[key]))));
      else el.value = S[key] == null ? "" : S[key];
    }
    refreshDerived();
    renderCities();
    renderPlace();
    renderEventsAdmin();
  }

  // ============================================================
  // cities editor (clock only)
  // ============================================================
  function wireCities(root) {
    const input = root.querySelector("[data-cities-input]");
    const add = () => {
      const found = CS.resolveCity(input.value, zones);
      if (!found) return setCityMsg("Couldn't find that city. Try a time zone like Asia/Tokyo.");
      if (current.S.cities.some(c => c.tz === found.tz && c.name === found.name)) return setCityMsg("Already in the list.");
      patch({ cities: current.S.cities.concat([found]) });
      input.value = "";
      renderCities();
    };
    root.querySelector("[data-cities-add]").addEventListener("click", add);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  }

  function setCityMsg(text, info) {
    const m = document.querySelector("[data-cities-msg]");
    if (!m) return;
    m.textContent = text;
    m.className = "msg" + (info ? " info" : "");
  }

  function renderCities() {
    const list = document.querySelector("[data-cities-list]");
    if (!list) return;
    const S = current.S;
    list.innerHTML = "";
    S.cities.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "city-item";
      const label = c.tz === "local" ? esc(CS.displayName(c, S)) + "<small>your location</small>" : `${esc(c.name)}<small>${esc(c.tz)}</small>`;
      row.innerHTML = `<span>${label}</span><span class="btns">
        <button data-act="up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button data-act="down" ${i === S.cities.length - 1 ? "disabled" : ""}>↓</button>
        <button data-act="del">✕</button></span>`;
      row.querySelector(".btns").addEventListener("click", (e) => {
        const act = e.target.dataset.act;
        if (!act) return;
        const next = S.cities.slice();
        if (act === "del") next.splice(i, 1);
        if (act === "up" && i > 0) [next[i - 1], next[i]] = [next[i], next[i - 1]];
        if (act === "down" && i < next.length - 1) [next[i + 1], next[i]] = [next[i], next[i + 1]];
        patch({ cities: next });
        renderCities();
      });
      list.appendChild(row);
    });
    const full = S.cities.length >= CS.MAX_CITIES;
    document.querySelector("[data-cities-add]").disabled = full;
    document.querySelector("[data-cities-input]").disabled = full;
    setCityMsg(full ? `Maximum of ${CS.MAX_CITIES} cities` : "", true);
  }


  // ============================================================
  // place search (weather only): Open-Meteo geocoding
  // ============================================================
  let placeResults = [];

  function setPlaceMsg(text, isError) {
    const m = document.querySelector("[data-place-msg]");
    if (!m) return;
    m.textContent = text;
    m.className = "msg" + (isError ? "" : " info");
  }

  function renderPlace() {
    const cur = document.querySelector("[data-place-current]");
    if (!cur) return;
    cur.textContent = current.S.location ? WX.placeLabel(current.S.location) : "Not set";
    const list = document.querySelector("[data-place-results]");
    list.innerHTML = "";
    placeResults.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "city-item";
      row.innerHTML = `<span>${esc(p.name)}<small>${esc([p.admin1, p.country].filter(Boolean).join(", "))}</small></span><span class="btns"><button data-use="${i}">Use</button></span>`;
      list.appendChild(row);
    });
  }

  function wirePlace(root) {
    const input = root.querySelector("[data-place-input]");
    const search = async () => {
      const q = input.value.trim();
      if (q.length < 2) return setPlaceMsg("Type at least 2 letters.", true);
      setPlaceMsg("Searching…");
      try {
        const res = await fetch(WX.buildGeoUrl(q));
        placeResults = WX.parseGeo(await res.json());
        renderPlace();
        setPlaceMsg(placeResults.length ? "Pick the right one:" : "No matches. Try just the city name.", !placeResults.length);
      } catch (e) {
        setPlaceMsg("Couldn't search (" + (e && e.message ? e.message : e) + "). Check your connection.", true);
      }
    };
    root.querySelector("[data-place-search]").addEventListener("click", search);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
    root.addEventListener("click", (e) => {
      const use = e.target.closest("[data-use]");
      if (use) {
        patch({ location: placeResults[Number(use.dataset.use)] });
        placeResults = []; input.value = "";
        renderPlace(); setPlaceMsg("Location set. The widget will load it in a moment.");
      } else if (e.target.closest("[data-place-clear]")) {
        patch({ location: null }); placeResults = []; renderPlace(); setPlaceMsg("");
      }
    });
  }


  // ============================================================
  // saved events admin (calendar only)
  // ============================================================
  let evClearTimer = null;

  function renderEventsAdmin() {
    const c = document.querySelector("[data-ev-count]");
    if (!c) return;
    const n = (current.S.events || []).length;
    c.textContent = n === 1 ? "1 event" : n + " events";
    const btn = document.querySelector("[data-ev-clear]");
    btn.disabled = n === 0;
    btn.textContent = "Delete all events…";
  }

  function wireEventsAdmin(root) {
    const btn = root.querySelector("[data-ev-clear]");
    btn.addEventListener("click", () => {
      if (btn.dataset.armed !== "1") {          // first click arms it, second click confirms
        btn.dataset.armed = "1"; btn.textContent = "Click again to delete all";
        clearTimeout(evClearTimer);
        evClearTimer = setTimeout(() => { btn.dataset.armed = "0"; renderEventsAdmin(); }, 4000);
        return;
      }
      btn.dataset.armed = "0"; clearTimeout(evClearTimer);
      patch({ events: [], eventsRev: "manager-" + Date.now() });
      renderEventsAdmin();
    });
  }

  // ============================================================
  // reset
  // ============================================================
  $("#resetBtn").addEventListener("click", async () => {
    if (!current) return;
    lastLocalPatch = performance.now();
    const kept = current.def.preserve || [];
    await invoke("reset_widget_settings", { id: current.def.id, keep: kept });
    const keptValues = {};
    for (const k of kept) if (current.S[k] !== undefined) keptValues[k] = current.S[k];
    current.S = current.def.merge(keptValues);
    refreshUI();
  });

  // ============================================================
  // boot
  // ============================================================
  (async function init() {
    showView("list");
    await refreshStates();

    // a widget was closed/pinned from somewhere else (e.g. right-click on the widget)
    listen("widget-states", (e) => { states = e.payload || {}; renderList(); renderHint(); });

    // settings changed from the widget itself (e.g. the clock's 12h/24h switch)
    listen("widget-settings", (e) => {
      const p = e.payload;
      if (!current || !p || p.id !== current.def.id) return;
      if (performance.now() - lastLocalPatch < 400) return;   // our own echo
      current.S = current.def.merge(p.settings);
      refreshUI();
    });
  })();
</script>
</body>
</html>
