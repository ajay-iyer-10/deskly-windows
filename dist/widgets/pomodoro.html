<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../shared/widget.css" />
<style>
  .meta { display: flex; align-items: center; justify-content: center; min-height: 1.6rem; }
  .label { text-align: center; font-size: .8rem; font-weight: 700; letter-spacing: .02em; color: rgb(var(--fg) / .6); }

  .progress { height: .32rem; border-radius: 999px; background: rgb(var(--fg) / .1); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: rgb(var(--accent)); transition: width .4s linear; }

  .controls { display: flex; gap: .5rem; }
  .controls .primary { flex: 1; }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-height: 1rem; }
  .dots { display: flex; gap: .4rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: rgb(var(--fg) / .15); }
  .dot.done { background: rgb(var(--accent)); }
  .dot.now { box-shadow: 0 0 0 .14rem rgb(var(--accent) / .4); }

  .card.done { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 .35rem 1.1rem rgb(0 0 0 / .22); }
    50% { box-shadow: 0 0 0 .3rem rgb(var(--accent) / .55), 0 .35rem 1.1rem rgb(0 0 0 / .22); }
  }
</style>
</head>
<body>
  <div id="frame"><div class="card" id="card"></div></div>

  <script src="../shared/common.js"></script>
  <script src="../shared/pomodoro-shared.js"></script>
  <script>
    const WC = window.WidgetCommon, P = window.PomodoroShared;
    const card = document.getElementById("card");
    const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

    let S = P.merge({});
    let rt = P.freshRuntime(S, "focus", Date.now());
    let boot = null;
    let statusMsg = "";        // e.g. "Focus complete" until the next action
    let timer = null, doneTimer = null;

    // ---------- sound (generated, no audio files) ----------
    let audioCtx = null;
    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) { audioCtx = null; }
    }
    function chime() {
      if (!S.sound) return;
      ensureAudio();
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      [[880, 0], [1175, 0.2], [1568, 0.4]].forEach(([freq, delay]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(0, t + delay);
        g.gain.linearRampToValueAtTime(0.25, t + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.6);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + delay); o.stop(t + delay + 0.65);
      });
    }
    card.addEventListener("pointerdown", ensureAudio);

    // ---------- appearance + structure ----------
    function applyAppearance() {
      WC.applyAppearance(S, darkQuery.matches);
      const root = document.documentElement;
      root.style.setProperty("--card-w", P.LAYOUT_WIDTH_REM[S.layout] + "rem");
      root.style.setProperty("--time-size", P.timeSizeRem(S) + "rem");
    }

    function buildStructure() {
      card.className = "card " + S.layout;
      let html = "";
      if (S.layout === "standard") {
        html += '<div class="meta"><div class="pill" id="modes">' +
          P.MODES.map(m => '<button data-mode="' + m + '">' + (m === "focus" ? "Focus" : m === "short" ? "Short" : "Long") + "</button>").join("") + "</div></div>";
      } else {
        html += '<div class="label" id="label"></div>';
      }
      html += '<div class="time" id="time"></div>';
      if (S.layout === "standard" && S.showProgress) html += '<div class="progress"><i id="bar"></i></div>';
      html += '<div class="controls"><button class="btn primary" id="toggleBtn"></button>' +
        '<button class="btn" id="resetBtn">Reset</button>' +
        (S.layout === "standard" ? '<button class="btn" id="skipBtn">Skip</button>' : "") + "</div>";
      if (S.layout === "standard") html += '<div class="foot"><div class="dots" id="dots"></div><span class="muted" id="status"></span></div>';
      card.innerHTML = html;
    }

    // ---------- render (cheap, called on every tick and every action) ----------
    function render() {
      const now = Date.now();
      const rem = P.remaining(rt, now);
      document.getElementById("time").innerHTML = WC.digitsHtml(P.formatMMSS(rem));
      document.getElementById("toggleBtn").textContent = rt.running ? "Pause" : rt.fresh ? "Start" : "Resume";

      const modes = document.getElementById("modes");
      if (modes) for (const b of modes.children) b.classList.toggle("on", b.dataset.mode === rt.mode);

      const bar = document.getElementById("bar");
      if (bar) {
        const total = P.durationMs(S, rt.mode);
        bar.style.width = Math.min(100, Math.max(0, (1 - rem / total) * 100)) + "%";
      }

      const dots = document.getElementById("dots");
      if (dots) {
        let h = "";
        for (let i = 0; i < S.sessionsBeforeLong; i++) {
          const cls = i < rt.cycle ? "dot done" : (i === rt.cycle && rt.mode === "focus") ? "dot now" : "dot";
          h += '<span class="' + cls + '"></span>';
        }
        dots.innerHTML = h;
      }

      const status = document.getElementById("status");
      if (status) status.textContent = statusMsg || (rt.todayCount + (rt.todayCount === 1 ? " session today" : " sessions today"));
      const label = document.getElementById("label");
      if (label) label.textContent = statusMsg || (P.MODE_LABELS[rt.mode] + (rt.running ? "" : rt.fresh ? "" : " · paused"));
    }

    // ---------- timer loop ----------
    function persist() { if (boot) boot.patch({ runtime: rt }); }

    function schedule() {
      clearTimeout(timer);
      render();
      if (!rt.running) return;
      const rem = P.remaining(rt, Date.now());
      if (rem <= 0) { complete(); return; }
      const frac = rem % 1000;
      timer = setTimeout(schedule, (frac === 0 ? 1000 : frac) + 15);
    }

    function flashDone() {
      card.classList.remove("done");
      void card.offsetWidth;                 // restart the animation
      card.classList.add("done");
      clearTimeout(doneTimer);
      doneTimer = setTimeout(() => card.classList.remove("done"), 3200);
    }

    function complete() {
      const res = P.finish(S, rt, Date.now());
      rt = res.rt;
      statusMsg = res.from === "focus" ? "Focus complete" : "Break over";
      chime();
      flashDone();
      persist();
      schedule();
    }

    function act(fn) { statusMsg = ""; rt = fn(); persist(); schedule(); }

    // ---------- interaction ----------
    card.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      ensureAudio();
      const now = Date.now();
      if (btn.id === "toggleBtn") act(() => rt.running ? P.pause(rt, now) : P.start(S, rt, now));
      else if (btn.id === "resetBtn") act(() => P.reset(S, rt));
      else if (btn.id === "skipBtn") { statusMsg = ""; rt = P.skip(S, rt, now).rt; persist(); schedule(); }
      else if (btn.dataset.mode) act(() => P.setMode(S, rt, btn.dataset.mode, now));
    });

    // ---------- settings ----------
    function onSettings(partial, initial, isReset) {
      const next = P.merge(partial);
      const changed = P.settingsKey(next) !== P.settingsKey(S);
      S = next;
      if (initial) {
        rt = P.normalizeRuntime(S, partial.runtime, Date.now());
        applyAppearance(); buildStructure(); schedule();
        if (boot) boot.scheduleResize();
        return;
      }
      if (isReset) { statusMsg = ""; rt = P.freshRuntime(S, "focus", Date.now()); persist(); }
      if (!changed && !isReset) return;               // just our own timer state echoing back
      if (rt.fresh && !rt.running) rt.remainingMs = P.durationMs(S, rt.mode);   // new length applies if untouched
      applyAppearance(); buildStructure(); schedule();
      if (boot) boot.scheduleResize();
    }

    darkQuery.addEventListener("change", () => { if (S.theme === "auto") applyAppearance(); });

    // boot: defaults first so something renders immediately, then load saved state
    applyAppearance(); buildStructure(); schedule();
    boot = WC.bootstrap({ id: "pomodoro", frame: document.getElementById("frame"), card, onSettings });
  </script>
</body>
</html>
